name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # 합성 양식으로 전체 시험. 실데이터 회귀(-m realdata)는 데이터가 없으므로 건너뛴다
      - run: pytest
      # 제3자 라이선스 (tasks/0009 4.3 나): .[postgres] 를 설치한 환경의 닫힘으로 같은 검사 — 윈도우 묶음의 닫힘(tzdata …)과는
      # 조금 다르다. 묶음의 목록은 윈도우 작업이 묶음을 만들 때 wheels/ 로 검사한다 (tasks/0009 단계 5 — scripts/bundle.py)
      - run: pip install -e ".[postgres]"
      - run: python scripts/licenses.py --installed postgres --check --out THIRD_PARTY_NOTICES.txt

  lowest:
    # pyproject 의 하한(OpenCV 4.9, numpy 1.26, openpyxl 3.1.0, pypdfium2 4.30)에서도 같은 시험. 위 작업은 최신판만 받는다 —
    # OpenCV 5.0 은 내장 글꼴 모양을 바꿨고, 그 차이로 4.x 에서만 실패하던 시험이 있었다 (CLAUDE.md "실데이터에서 배운 것")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" "opencv-python-headless==4.9.0.80" "numpy==1.26.4" "openpyxl==3.1.0" "pypdfium2==4.30.0"
      - run: python -c "import cv2, numpy, openpyxl, pypdfium2; print(cv2.__version__, numpy.__version__, openpyxl.__version__, pypdfium2.version.PYPDFIUM_INFO)"
      - run: pytest

  slow:
    # 기본 pytest 에서 떼어 낸 무거운 시험 (-m slow): 다시 처리의 불변식 흔들기(결정·검수를 섞어 넣고 그때마다 처음부터 만든 DB 와 비교),
    # 합성 접수 시나리오(synth --intake 를 끝까지 → 견줄 묶음과 같다), 정확히 돌린 쪽 = 바로 선 쪽, 처리 순서 흔들기 — 기본 시험 시간을
    # 지금의 1.25배 안에 두려고 (tasks/0007 6절). 0008 에서: 접수 묶음의 엑셀 끝에서 끝까지(싣기를 뺀 판), 가린 그림, 월 경계·표시 이름 묶음
    # (1.15배 — tasks/0008 6절)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m slow

  postgres:
    # 통합 DB 로 싣기 (tasks/0008 4.8): PostgreSQL 16 서비스 컨테이너에 싣고 불변식(대상의 행 = 작업 DB 의 행)을 본다.
    # 시험마다 새 스키마. -m postgres 는 slow 인 것(흔들기에 싣기를 끼운 판)도 같이 돈다
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MINEDOCSCAN_TEST_PG_URL: postgresql://postgres:ci-only@127.0.0.1:5432/mdtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -m postgres -s

  train:
    # 숫자 인식기 학습 시험 (torch 필요, 몇 분). 합성 셀만으로 학습한 모델의 문턱, torch ↔ OpenCV 출력 일치,
    # 그리고 시험용 모델(tests/fixtures/digits-fixture)을 다시 만들어도 단계 5 의 문턱을 넘는지 (tasks/0003 6절)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # torch 는 CPU 전용 인덱스에서 받는다 (PyPI 의 리눅스 판은 CUDA 를 같이 받아 수 GB)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -m train -s
