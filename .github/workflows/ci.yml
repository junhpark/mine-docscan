name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # 합성 양식으로 전체 시험. 실데이터 회귀(-m realdata)는 데이터가 없으므로 건너뛴다
      - run: pytest

  lowest:
    # pyproject 의 하한(OpenCV 4.9, numpy 1.26)에서도 같은 시험. 위 작업은 최신판만 받는다 —
    # OpenCV 5.0 은 내장 글꼴 모양을 바꿨고, 그 차이로 4.x 에서만 실패하던 시험이 있었다 (CLAUDE.md "실데이터에서 배운 것")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" "opencv-python-headless==4.9.0.80" "numpy==1.26.4"
      - run: python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
      - run: pytest

  train:
    # 숫자 인식기 학습 시험 (torch 필요, 몇 분). 합성 셀만으로 학습한 모델의 문턱, torch ↔ OpenCV 출력 일치,
    # 그리고 시험용 모델(tests/fixtures/digits-fixture)을 다시 만들어도 단계 5 의 문턱을 넘는지 (tasks/0003 6절)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # torch 는 CPU 전용 인덱스에서 받는다 (PyPI 의 리눅스 판은 CUDA 를 같이 받아 수 GB)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -m train -s
