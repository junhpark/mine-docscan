name: ci

on:
  workflow_dispatch:      # 임시 탐침 가지 (지운다)

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sSfL "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip.sigstore" -o s.json
          python3 -c "import json,base64;d=json.load(open('s.json'));m=d['messageSignature']['messageDigest'];print(m['algorithm'], base64.b64decode(m['digest']).hex())"
