name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # 합성 양식으로 전체 시험. 실데이터 회귀(-m realdata)는 데이터가 없으므로 건너뛴다
      - run: pytest

  train:
    # 숫자 인식기 학습 시험 (torch 필요, 몇 분). 합성 셀만으로 학습한 모델의 문턱, torch ↔ OpenCV 출력 일치,
    # 그리고 시험용 모델(tests/fixtures/digits-fixture)을 다시 만들어도 단계 5 의 문턱을 넘는지 (tasks/0003 6절)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # torch 는 CPU 전용 인덱스에서 받는다 (PyPI 의 리눅스 판은 CUDA 를 같이 받아 수 GB)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -m train -s
