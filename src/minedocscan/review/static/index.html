<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minedocscan 검수</title>
<!-- 외부 글꼴·스크립트·CDN 을 쓰지 않는다. 현장은 외부 네트워크가 없다. -->
<style>
  :root { --fg:#1b1b1b; --muted:#6b6b6b; --line:#d9d9d9; --accent:#1f5fbf; --bad:#b4232c; --ok:#1d7a3a; --bg:#f6f6f4; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; }
  header .q { font-weight:600; }
  header .hint { color:var(--muted); width:100%; font-size:13px; }
  header .prog b { font-variant-numeric: tabular-nums; }
  main { max-width: 1400px; margin: 0 auto; padding: 14px 16px 60px; }
  h1 { font-size:17px; margin: 8px 0 12px; font-weight:600; }
  .item { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:14px; }
  .cell { display:grid; grid-template-columns: 1fr; gap:8px; padding:10px 0; border-top:1px dashed var(--line); }
  .cell:first-of-type { border-top:0; }
  .label { font-size:13px; color:var(--muted); }
  .row img { max-width:100%; height:auto; border:1px solid var(--line); background:#fff; }
  .big { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .big img { max-height:260px; border:1px solid var(--line); image-rendering:auto; }
  input.val { font-size:34px; width: 10ch; padding:4px 10px; border:2px solid var(--line); border-radius:6px; }
  input.val:focus { outline:none; border-color:var(--accent); }
  input.val.text { width: 28ch; font-size:24px; }
  .prev { font-size:13px; color:var(--muted); }
  .src { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-left:6px; }
  .prev b { color:var(--ok); }
  .ro { font-size:22px; color:var(--ok); }
  .msg { min-height:1.4em; color:var(--bad); }
  .keys { color:var(--muted); font-size:13px; margin-top:6px; }
  kbd { font: 12px ui-monospace, monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:#fafafa; }
  .done { padding:40px 0; text-align:center; color:var(--muted); font-size:18px; }
  button { font: inherit; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
  .pair img { max-height:200px; border:1px solid var(--line); }
  .choices { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .choices button { font-size:18px; padding:8px 16px; }
  .choices button.on { border-color:var(--accent); background:#e8f0fc; font-weight:600; }
  .ask { border:2px solid var(--accent); border-radius:6px; background:#eef4fd; padding:10px 12px; }
</style>
</head>
<body>
<header>
  <span class="q" id="qname">…</span>
  <span>검수자 <b id="reviewer">…</b></span>
  <span class="prog">진행 <b id="done">0</b> / <b id="total">0</b></span>
  <span id="pos" class="prog"></span>
  <span class="hint" id="ghint">종이에 적힌 <b>그대로</b> 입력합니다. 두 문서의 값이 달라도 각각 적힌 대로 — 어느 쪽이 맞는지는 정하지 않습니다.
    <kbd>Enter</kbd> 저장·다음 &nbsp; 빈 채로 <kbd>Enter</kbd> 빈 칸 &nbsp; <kbd>?</kbd><kbd>Enter</kbd> 읽을 수 없음 &nbsp;
    <kbd>PgUp</kbd>/<kbd>PgDn</kbd> 이전/다음 &nbsp; 묶음은 <kbd>Tab</kbd> 으로 이동</span>
  <span class="hint" id="qhint"></span>
</header>
<main>
  <div id="view"></div>
  <div class="msg" id="msg"></div>
</main>
<script>
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const state = { items: [], idx: 0, done: 0, total: 0, showMachine: false, entered: {}, templates: {}, busy: false, renderedAt: 0, candidates: {},
                  queue: '', checked: {}, formats: {}, dotted: null, asking: false };
  // ✓ 행(checks)의 답: 키 → 서버의 answer, 보이는 이름 (tasks/0004 4.9 — 두 칸의 판정으로 저장된다)
  const CHECK = { '1': ['yes', '유'], '2': ['no', '무'], 'Enter': ['none', '표시 없음'], '?': ['unknown', '모름'] };
  const $ = (id) => document.getElementById(id);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function msg(t, ok) { const m = $('msg'); m.textContent = t || ''; m.style.color = ok ? 'var(--ok)' : 'var(--bad)'; }

  async function loadQueue(keep) {
    const at = state.idx;
    const r = await fetch('/api/queue?' + qs.toString());
    const q = await r.json();
    if (!r.ok) { msg(q.error || '대기열을 받지 못했습니다'); return; }
    state.items = q.items; state.done = q.done; state.total = q.total; state.showMachine = q.show_machine;
    state.templates = q.templates || {};
    state.candidates = q.candidates || {};
    state.formats = q.formats || {};    // 형식마다 받는 글자·안내 (forms/formats.py — 서버가 다시 검사한다)
    // 점으로 쓴 시각의 규칙 (forms/formats.dotted_clock_rule): 정규식과 분·하루의 상한 — 수는 서버에서만 온다
    state.dotted = q.dotted_clock ? { re: new RegExp(q.dotted_clock.pattern), maxMinute: q.dotted_clock.max_minute,
                                      maxDay: q.dotted_clock.max_day_minutes } : null;
    state.queue = q.name;
    $('qname').textContent = '대기열 ' + q.name + ' · ' + (q.site || '');
    // 숫자 정답을 만드는 대기열: 이 규칙이 인식기의 "빈 칸"과 "거절"의 정답이 된다 (tasks/0003 4.3, docs/DATA.md)
    $('qhint').innerHTML = (q.name === 'haul-numbers' || q.name === 'mismatch')
      ? '<b>X 표·지운 칸·이웃 칸에서 넘어온 글씨는 비워 두고 Enter (빈 칸).</b> 숫자인데 읽을 수 없으면 <kbd>?</kbd>'
      : (q.name === 'meta-check'
        ? '<b>라벨(또는 검수)의 값과 기계가 읽은 값이 다릅니다.</b> 종이에 적힌 값을 입력합니다 — <kbd>Alt</kbd>+<kbd>L</kbd> 라벨 값, <kbd>Alt</kbd>+<kbd>K</kbd> 기계 값'
        : (q.name === 'checks'
          ? '<b>행의 유·무 두 칸을 보고 표시된 칸을 고릅니다.</b> <kbd>1</kbd> 유 &nbsp; <kbd>2</kbd> 무 &nbsp; <kbd>Enter</kbd> 표시 없음 &nbsp; '
            + '<kbd>?</kbd> 모름 — 누르면 바로 저장하고 다음 행. ✓ 가 경계선을 넘었으면 <b>시작한 칸</b>이 표시한 칸입니다. '
            + '<kbd>PgUp</kbd>/<kbd>PgDn</kbd> 이전/다음 (전에 고른 답이 보이고, 다시 고르면 고쳐 저장합니다)'
          : (q.name === 'readings'
            ? '<b>쪽의 가동 시간 칸 — 계기 칸(시작·종료·총)과 근무 시각 칸 — 을 한 번에 입력합니다.</b> '
              + esc((state.formats.reading || {}).hint || '')
              + ' — 빈 칸은 비워 두고 <kbd>Enter</kbd>. 앞날의 값은 보여 주지 않습니다 (따라 적지 않게)'
            : (q.name === 'usage-check'
              ? '<b>검산이 어긋난 칸들입니다.</b> 종이와 다르게 입력된 칸만 고치고 <kbd>Enter</kbd> — 맞게 되면 빠집니다. '
                + '아무것도 고치지 않고 <kbd>Enter</kbd> 하면 "종이에 적힌 대로"를 확인한 것입니다 (어긋남은 그대로 남습니다 — 값을 맞춰 넣지 않습니다)'
              : ''))));
    $('ghint').style.display = q.name === 'checks' ? 'none' : '';
    $('reviewer').textContent = q.reviewer;
    document.title = 'minedocscan 검수 — ' + q.name;
    state.idx = keep ? Math.min(at, state.items.length) : 0;
    if (q.name === 'checks') {          // 검수한 행도 목록에 있다 (다시 열면 전에 고른 답) — 아직 안 한 첫 행부터
      const k = state.items.findIndex(it => !it.answer);
      state.idx = k < 0 ? state.items.length : k;
    }
    render();
  }

  function updateProgress() {
    $('done').textContent = state.done; $('total').textContent = state.total;
    $('pos').textContent = state.items.length ? ('항목 ' + (state.idx + 1) + ' / ' + state.items.length) : '';
  }

  function titleOf(item) {
    // 제목의 두 번째 조각이 템플릿 이름이면 사람이 읽는 제목으로 바꾼다
    const parts = item.title.split(' · ');
    if (parts.length > 1 && state.templates[parts[1]]) parts[1] = state.templates[parts[1]];
    return parts.join(' · ');
  }

  function render() {
    updateProgress();
    const v = $('view');
    if (!state.items.length || state.idx >= state.items.length) {
      v.innerHTML = '<div class="done">이 대기열은 끝났습니다. <button id="reload">다시 받기</button></div>';
      $('reload').onclick = () => loadQueue(false);
      return;
    }
    const item = state.items[state.idx];
    if (state.queue === 'checks') { renderCheck(v, item); return; }
    const fixing = state.queue === 'usage-check';
    let h = '<div class="item"><h1>' + esc(titleOf(item)) + '</h1>';
    if (fixing && item.check) {        // 검산: 비교한 두 값과 차이 (계기 값은 시간, 소계는 개수)
      const k = item.check;
      h += '<div class="prev">비교: <b>' + esc(k.value_a) + '</b> 대 <b>' + esc(k.value_b == null ? '-' : k.value_b) + '</b>'
        + (k.diff == null ? '' : ' · 차이 <b>' + esc(k.diff) + '</b>')
        + (k.days_between ? ' · 사이에 낀 날 ' + esc(k.days_between) + '일' : '') + '</div>';
    }
    item.cells.forEach((c, i) => {
      const prev = state.entered[c.field_id] || c.review;
      const fmt = fmtOf(c);
      const isNum = fmt === 'integer';
      h += '<div class="cell">';
      h += '<div class="label">' + esc(c.label) + '</div>';
      h += '<div class="row"><img data-crop="/crop?field_id=' + encodeURIComponent(c.field_id) + '&kind=row" alt="행"></div>';
      h += '<div class="big"><img data-crop="/crop?field_id=' + encodeURIComponent(c.field_id) + '&kind=cell&scale=3" alt="셀">';
      if (!fixing && c.review && !state.entered[c.field_id] && item.cells.length > 1) {
        // 묶음에서 이미 검수된 셀은 참고용으로만 보여 준다 (다시 입력하지 않는다)
        h += '<div class="ro">' + esc(shown(c.review)) + ' <span class="label">(검수됨 · ' + esc(c.review.reviewer) + ')</span></div>';
      } else {
        let init = '', decided = true;      // decided: 미리 채운 값이 사람이 정한 값(검수했던 값, usage-check 의 저장된 값)인가
        if (fixing && c.current) init = c.current.has_value ? (c.current.value == null ? '' : c.current.value) : '';
        else if (prev) init = prev.verdict === 'value' ? prev.value : (prev.verdict === 'illegible' ? '?' : '');
        else if (state.showMachine && c.machine && c.machine.value_raw) { init = c.machine.value_raw; decided = false; }
        const cands = c.meta_key ? (state.candidates[c.meta_key] || []) : null;
        const listId = cands ? ('dl-' + i) : '';
        h += '<input class="val ' + (isNum ? 'num' : (fmt ? 'fmt' : 'text')) + '" data-i="' + i + '" data-fid="' + esc(c.field_id) + '"'
          + (fmt ? ' data-fmt="' + esc(fmt) + '"' : '')
          + (c.meta_key ? ' data-meta="' + esc(c.meta_key) + '"' : '') + (listId ? ' list="' + listId + '"' : '')
          + (c.ask_dotted ? ' data-dotted="1" data-decided="' + esc(decided ? init : '') + '"' : '')
          + (c.human ? ' data-human="' + esc(c.human.value) + '" data-machine="' + esc(c.machine ? c.machine.value_raw : '') + '"' : '')
          + (isNum ? ' inputmode="numeric"' : (fmt === 'decimal' ? ' inputmode="decimal"' : '')) + ' data-init="' + esc(init) + '"'
          + ' value="' + esc(init) + '" autocomplete="off" spellcheck="false">';
        if (fmt && !isNum && state.formats[fmt]) h += '<span class="label">' + esc(state.formats[fmt].hint) + '</span>';
        if (cands) {   // 후보 목록: 행렬 머리글 + 지금까지의 라벨·검수. 외부 자원 없이 <datalist> 로
          h += '<datalist id="' + listId + '">' + cands.map(v => '<option value="' + esc(v) + '"></option>').join('') + '</datalist>';
          h += '<span class="label">Alt+1–9 로 고를 수 있습니다: ' + cands.slice(0, 9).map((v, k) => (k + 1) + ' ' + esc(v)).join(' · ') + '</span>';
        }
        if (fixing && c.current) h += '<span class="prev">지금 값: <b>' + esc(c.current.has_value ? c.current.value : '(빈 칸)') + '</b></span>';
        else if (prev) h += '<span class="prev">입력했던 값: <b>' + esc(shown(prev)) + '</b></span>';
        if (c.human && c.machine) {   // meta-check: 두 값을 같이 보여 준다 (어느 쪽이 맞는지는 종이를 보고 정한다)
          const conf = (c.machine.confidence == null) ? '' : ' · 신뢰도 ' + Number(c.machine.confidence).toFixed(2);
          h += '<span class="prev">라벨·검수(' + esc(c.human.source) + '): <b>' + esc(c.human.value) + '</b> · 기계: <b>'
            + esc(c.machine.value_raw) + '</b> (' + esc(c.machine.status) + conf + ')</span>';
        }
      }
      h += '<span class="src" data-src-of="' + i + '"></span></div></div>';
    });
    h += '<div class="keys">' + (item.cells.filter(c => !(c.review && !state.entered[c.field_id] && item.cells.length > 1)).length > 1
      ? '마지막 칸에서 <kbd>Enter</kbd> 하면 전부 저장합니다.' : '') + '</div></div>';
    v.innerHTML = h;
    v.querySelectorAll('img[data-crop]').forEach(loadCrop);
    const inputs = v.querySelectorAll('input.val');
    inputs.forEach(inp => {
      inp.addEventListener('keydown', onKey);
      if (inp.classList.contains('num')) inp.addEventListener('input', () => { inp.value = ascii(inp.value).replace(/[^0-9?]/g, ''); });
      if (inp.classList.contains('fmt')) {   // 형식마다 받는 글자만 (서버가 형식을 다시 검사한다 — 맞지 않으면 아무것도 저장하지 않는다)
        const f = state.formats[inp.dataset.fmt];
        if (f) { const bad = new RegExp('[^' + f.chars + '?]', 'g'); inp.addEventListener('input', () => { inp.value = ascii(inp.value).replace(bad, ''); }); }
      }
    });
    if (inputs.length) { inputs[0].focus(); inputs[0].select(); }
    state.renderedAt = performance.now();
    msg('');
  }

  function renderCheck(v, item) {
    // 기계의 판정은 응답에도 화면에도 없다. 두 칸을 같이 보여 준다 (✓ 는 경계선을 넘어 그려진다)
    const yes = item.cells[0].field_id;
    const prev = state.checked[item.item_id] || item.answer;
    let h = '<div class="item"><h1>' + esc(titleOf(item)) + '</h1>';
    h += '<div class="cell"><div class="label">행 전체</div>';
    h += '<div class="row"><img data-crop="/crop?field_id=' + encodeURIComponent(yes) + '&kind=row&box=0" alt="행"></div>';
    h += '<div class="label">이상 유 (왼쪽) · 무 (오른쪽)</div>';
    h += '<div class="big pair"><img data-crop="/crop?field_id=' + encodeURIComponent(yes) + '&kind=pair" alt="유·무 두 칸">';
    h += '<span class="src"></span></div>';
    h += '<div class="choices">' + Object.entries(CHECK).map(([k, [a, name]]) =>
      '<button data-key="' + esc(k) + '"' + (prev === name ? ' class="on"' : '') + '><kbd>' + esc(k) + '</kbd> ' + esc(name) + '</button>').join('') + '</div>';
    if (prev) h += '<div class="prev">전에 고른 답: <b>' + esc(prev) + '</b></div>';
    h += '</div></div>';
    v.innerHTML = h;
    v.querySelectorAll('img[data-crop]').forEach(loadCrop);
    v.querySelectorAll('.choices button').forEach(b => b.addEventListener('click', () => saveCheck(b.dataset.key, true)));
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    state.renderedAt = performance.now();
    msg('');
  }

  async function saveCheck(key, clicked) {
    if (state.busy || !CHECK[key]) return;
    // 새 행이 그려진 뒤 300 ms 안의 키는 앞 행을 향한 것이다 (보지 않은 행이 저장된다). 마우스는 예외
    if (!clicked && performance.now() - state.renderedAt < 300) return;
    const item = state.items[state.idx];
    if (!item) return;
    const [answer, name] = CHECK[key];
    state.busy = true;
    try {
      const r = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ field_id: item.cells[0].field_id, answer: answer }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('저장 실패 ' + r.status));
      if (!item.answer && !state.checked[item.item_id]) state.done += 1;
      state.checked[item.item_id] = name;
      next();
      msg('저장했습니다: ' + name, true);
    } catch (e) { msg(e.message); }
    finally { state.busy = false; }
  }

  async function loadCrop(img) {
    // 이미지를 fetch 로 받아야 응답 머리글(X-Crop-Source: 원본 해상도인지 정합 이미지인지)을 읽을 수 있다
    try {
      const r = await fetch(img.dataset.crop);
      if (!r.ok) { img.alt = '이미지 없음 (' + r.status + ')'; return; }
      const blob = await r.blob();
      img.src = URL.createObjectURL(blob);
      const src = r.headers.get('X-Crop-Source');
      const tag = img.closest('.cell') && img.closest('.cell').querySelector('.src');
      if (tag && src) tag.textContent = src === 'source' ? '원본 해상도' : '정합 이미지';
    } catch (e) { img.alt = '이미지를 받지 못했습니다'; }
  }

  function shown(r) { return r.verdict === 'value' ? r.value : (r.verdict === 'empty' ? '(빈 칸)' : '(읽을 수 없음)'); }

  function parse(inp) {
    const raw = inp.value.trim();
    if (raw === '?') return { verdict: 'illegible', value: '' };
    if (raw === '') return { verdict: 'empty', value: '' };
    return { verdict: 'value', value: raw };
  }

  // 한글 입력기의 전각 숫자·기호(８：００, ～)를 ASCII 로 바꾼 뒤에 거른다 — 그냥 거르면 지워져 빈 칸으로 저장된다 (forms/formats.py 와 같은 대응)
  function ascii(v) { return v.normalize('NFKC').replace(/[〜–—]/g, m => (m === '〜' ? '~' : '-')); }

  function fmtOf(c) { return c.format || (c.kind === 'handwritten_number' ? 'integer' : null); }

  async function postAll(plans) {
    // 한 항목의 칸을 한 번에: 서버가 전부 검사한 뒤에야 저장한다 — 한 칸이라도 형식에 맞지 않으면 아무것도 남지 않는다
    const r = await fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: plans.map(([fid, p, note]) => ({ field_id: fid, verdict: p.verdict, value: p.value, note: note || '' })) }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('저장 실패 ' + r.status));
    return j;
  }

  // 점으로 쓴 시각(tasks/0006 4.8): forms/formats.dotted_clock 과 같은 규칙 — 정규식과 상한은 서버가 보낸 것(state.dotted)만 쓴다.
  // 맞으면 'HH:MM', 아니면 null (tests/test_usage.py 가 같은 벡터로 이 함수를 돌려 Python 과 견준다)
  function dottedClock(v) {
    const d = state.dotted;
    const m = d ? d.re.exec(String(v).trim()) : null;
    if (!m) return null;
    const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
    if (mi > d.maxMinute || h * 60 + mi > d.maxDay) return null;
    return String(h).padStart(2, '0') + ':' + m[2];
  }

  function askDotted(inp, clock) {
    // 두 답만: 시각(콜론으로 바꿔 저장) / 계기 값(그대로 저장). Esc 는 입력으로 돌아간다 (저장하지 않는다).
    // confirm() 을 쓰지 않는다 — 취소가 "계기 값"인지 "돌아가기"인지 모호하다. 질문 중의 다른 키는 삼킨다 (Enter 연타가 답이 되지 않게)
    return new Promise(resolve => {
      const box = document.createElement('div');
      box.className = 'ask';
      box.innerHTML = '<div><b>' + esc(inp.value.trim()) + '</b> — 점으로 쓴 시각입니까? 시각이면 콜론으로 (' + esc(clock)
        + '). 계기 값이면 그대로 저장합니다.</div>'
        + '<div class="choices"><button type="button" data-a="clock"><kbd>1</kbd> 시각 → ' + esc(clock) + ' 으로 저장</button>'
        + '<button type="button" data-a="asis"><kbd>2</kbd> 계기 값 → 그대로 저장</button></div>'
        + '<div class="keys"><kbd>Esc</kbd> 돌아가서 고쳐 쓰기</div>';
      inp.closest('.cell').appendChild(box);
      state.asking = true;
      const finish = (a) => {
        document.removeEventListener('keydown', onAsk, true);
        box.remove(); state.asking = false; resolve(a);
      };
      const onAsk = (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (ev.repeat || ev.isComposing) return;
        if (ev.key === '1') finish('clock');
        else if (ev.key === '2') finish('asis');
        else if (ev.key === 'Escape') finish(null);
      };
      document.addEventListener('keydown', onAsk, true);
      box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => finish(b.dataset.a)));
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      box.scrollIntoView({ block: 'nearest' });
    });
  }

  async function saveItem() {
    if (state.busy || state.asking) return;   // 저장이 끝나기 전의 Enter 연타는 무시한다 (같은 셀 두 번 저장·다음 셀 건너뜀 방지)
    const item = state.items[state.idx];
    const inputs = Array.from($('view').querySelectorAll('input.val'));
    const plans = [];
    for (const inp of inputs) {
      const p = parse(inp);
      if (p.verdict === 'value' && inp.classList.contains('num')) {
        if (!/^[0-9]+$/.test(p.value)) { msg('숫자만 입력합니다'); inp.focus(); return; }
        if (p.value.length >= 3 && !confirm('세 자리 이상입니다: ' + p.value + ' — 맞습니까?')) { inp.focus(); inp.select(); return; }
      }
      if (p.verdict === 'value' && inp.dataset.meta) {   // 오타는 막되 새 사람·새 차는 받는다
        const cands = state.candidates[inp.dataset.meta] || [];
        if (cands.length && !cands.includes(p.value) && !confirm('목록에 없는 값입니다: ' + p.value + ' — 그대로 저장합니까?')) { inp.focus(); inp.select(); return; }
      }
      // 계기의 시작·종료 칸에 점으로 쓴 시각처럼 보이는 값: 저장 전에 묻는다. 미리 채운 값이 사람이 정한 값(검수했던 값,
      // usage-check 의 저장된 값)이고 그와 같으면 묻지 않는다 — 이미 정한 칸이다. pending 이 미리 채운 기계 값은 정한 값이 아니다
      if (p.verdict === 'value' && inp.dataset.dotted && p.value !== (inp.dataset.decided || '')) {
        const clock = dottedClock(p.value);
        if (clock) {
          const a = await askDotted(inp, clock);
          if (!a) { inp.focus(); inp.select(); return; }
          if (a === 'clock') { inp.value = clock; p.value = clock; }
        }
      }
      plans.push([inp.dataset.fid, p, state.queue === 'usage-check' ? item.item_id : '', inp.value.trim() !== (inp.dataset.init || '')]);
    }
    if (state.queue === 'usage-check') {
      // 고친 칸만 저장한다. 아무것도 고치지 않았으면 전부 — "종이에 적힌 대로"의 확인 (검수 note 에 검산 id)
      const changed = plans.filter(x => x[3]);
      const send = changed.length ? changed : plans;
      state.busy = true;
      try {
        await postAll(send);
        await loadQueue(true);                 // 검산이 다시 계산되었다 — 맞게 된 항목은 빠지고 진행 수는 서버가 센다
        msg(changed.length ? '고친 칸을 저장했습니다 — 검산을 다시 계산했습니다' : '적힌 대로 확인했습니다', true);
      } catch (e) { msg(e.message); }
      finally { state.busy = false; }
      return;
    }
    state.busy = true;
    try {
      const res = await postAll(plans);
      plans.forEach(([fid, p], k) => {
        if (!state.entered[fid]) {               // 처음 저장한 항목만 진행 수에 더한다
          if (item.cells.length === 1) state.done += 1;
        }
        state.entered[fid] = { verdict: p.verdict, value: res.saved[k].value };   // 정규화한 표기 (8-17 → 08:00~17:00)
      });
      if (item.cells.length > 1 && item.cells.every(c => state.entered[c.field_id] || c.review) && !item._counted) { item._counted = true; state.done += 1; }
      next();
      msg('저장했습니다', true);
    } catch (e) { msg(e.message); }
    finally { state.busy = false; }
  }

  function next() { if (state.idx < state.items.length) state.idx += 1; render(); }
  function prev() { if (state.idx > 0) state.idx -= 1; render(); }

  function onKey(ev) {
    // 후보 선택은 Alt+1–9. 숫자 키만으로 고르면 차량번호처럼 숫자로 시작하는 값을 칠 수 없다.
    // ev.key 가 아니라 ev.code(물리 키)로 본다: macOS 의 Option+숫자는 ev.key 가 '™' 같은 문자로 온다
    if (ev.target.dataset.human !== undefined && ev.altKey && (ev.code === 'KeyL' || ev.code === 'KeyK')) {   // meta-check
      ev.preventDefault(); ev.target.value = ev.code === 'KeyL' ? ev.target.dataset.human : ev.target.dataset.machine; return;
    }
    if (ev.target.dataset.meta && ev.altKey && /^Digit[1-9]$/.test(ev.code)) {
      const cands = state.candidates[ev.target.dataset.meta] || [];
      const v = cands[parseInt(ev.code.slice(5), 10) - 1];
      if (v !== undefined) { ev.preventDefault(); ev.target.value = v; return; }
    }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      // 키를 누르고 있을 때의 반복, 한글 입력기의 조합 확정 Enter 는 저장이 아니다 — 보지 않은 셀이 빈 칸으로 저장된다
      if (ev.repeat || ev.isComposing || ev.keyCode === 229 || state.busy) return;
      // 새 항목이 그려진 뒤 300 ms 안의 Enter 는 앞 항목을 향한 두 번째 Enter 다 (사람 속도 약 120 ms 간격).
      // 받으면 보지도 않은 셀이 빈 칸으로 저장된다
      if (performance.now() - state.renderedAt < 300) return;
      const inputs = Array.from($('view').querySelectorAll('input.val'));
      const i = inputs.indexOf(ev.target);
      if (i < inputs.length - 1) { inputs[i + 1].focus(); inputs[i + 1].select(); return; }   // 묶음: 다음 칸으로
      saveItem();
    }
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    if (ev.key === 'PageDown') { ev.preventDefault(); next(); }
    else if (ev.key === 'PageUp') { ev.preventDefault(); prev(); }
    else if (state.queue === 'checks' && !ev.altKey && !ev.ctrlKey && !ev.metaKey && !ev.isComposing && CHECK[ev.key]) {
      // 숫자 키는 ev.key 로 본다 (윗줄·숫자판 모두 '1'/'2'). ? 는 Shift+/ 이므로 ev.key 가 '?'
      ev.preventDefault(); saveCheck(ev.key, false);
    }
  });

  loadQueue(false);
})();
</script>
