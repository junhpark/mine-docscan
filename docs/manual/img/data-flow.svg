<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
  <title id="title">데이터가 어디에 있는가</title>
  <desc id="desc">스캐너가 접수 폴더에 저장한 파일은 보관 폴더로 옮겨지고, 처리한 결과는 작업 폴더의 작업 DB 에 들어간다. 사이트 팩의 템플릿과 검수·결정 기록을 읽는다. 엑셀 폴더, 통합 DB, 가린 쪽 그림은 작업 DB 에서 만든 사본이다. 설치 폴더와 설정 파일은 프로그램이다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3640"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif; fill: #1f2328; }
      .t { font-size: 16px; font-weight: bold; }
      .g { font-size: 14px; font-weight: bold; }
      .s { font-size: 13px; fill: #3d434b; }
      .l { font-size: 12px; fill: #3d434b; }
      .m { text-anchor: middle; }
      .box { fill: #eef2f7; stroke: #5b6470; stroke-width: 1.4; }
      .orig { fill: #fdf3d8; stroke: #9a6b00; stroke-width: 2.6; }
      .copy { fill: #ffffff; stroke: #5b6470; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .grp { fill: #f2f3f5; }
      .a { stroke: #2f3640; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="630" fill="#ffffff"/>

  <!-- 스캐너 → 접수 폴더 → 보관 폴더 -->
  <rect class="box" x="20" y="40" width="120" height="66" rx="8"/>
  <text class="t m" x="80" y="68">스캐너</text>
  <text class="s m" x="80" y="91">PDF 로 저장</text>
  <line class="a" x1="142" y1="73" x2="187" y2="73"/>

  <rect class="box" x="190" y="28" width="200" height="90" rx="8"/>
  <text class="t m" x="290" y="54">접수 폴더</text>
  <text class="s m" x="290" y="77">스캐너가 저장하는 폴더</text>
  <text class="s m" x="290" y="99">예: C:\Scans</text>
  <line class="a" x1="392" y1="73" x2="447" y2="73"/>
  <text class="l m" x="419" y="64">옮긴다</text>

  <rect class="orig" x="450" y="28" width="200" height="90" rx="8"/>
  <text class="t m" x="550" y="54">보관 폴더</text>
  <text class="s m" x="550" y="77">원본 스캔 — 지우지 않는다</text>
  <text class="s m" x="550" y="99">intake\ 아래에 쌓인다</text>

  <!-- 처리 → 작업 폴더 -->
  <line class="a" x1="550" y1="120" x2="550" y2="187"/>
  <text class="l" x="562" y="149">처리한다</text>
  <text class="l" x="562" y="166">분류·정합·인식</text>

  <rect class="copy" x="450" y="190" width="200" height="100" rx="8"/>
  <text class="t m" x="550" y="217">작업 폴더</text>
  <text class="s m" x="550" y="241">작업 DB (minedocscan.db)</text>
  <text class="s m" x="550" y="263">정합 그림·리포트</text>

  <!-- 사이트 팩 → 작업 폴더 -->
  <rect class="orig" x="120" y="180" width="250" height="120" rx="8"/>
  <text class="t m" x="245" y="206">사이트 팩</text>
  <text class="s m" x="245" y="230">템플릿 (양식 정의·기준 이미지)</text>
  <text class="s m" x="245" y="252">site.toml (현장 옵션)</text>
  <text class="s m" x="245" y="274">검수·결정 기록 (reviews\)</text>
  <line class="a" x1="372" y1="240" x2="447" y2="240"/>
  <text class="l m" x="409" y="231">읽는다</text>

  <!-- 홈·검수 화면 -->
  <rect class="box" x="120" y="372" width="250" height="80" rx="8"/>
  <text class="t m" x="245" y="398">홈·검수 화면</text>
  <text class="s m" x="245" y="420">브라우저 · 127.0.0.1:8765</text>
  <text class="s m" x="245" y="441">사람은 예외만 본다</text>
  <line class="a" x1="245" y1="370" x2="245" y2="303"/>
  <text class="l" x="257" y="342">검수·결정을 남긴다</text>
  <path class="a" d="M550,292 V412 H373"/>
  <text class="l m" x="462" y="431">할 일·대기열을 보여 준다</text>

  <!-- 사본 -->
  <rect class="grp" x="700" y="150" width="190" height="300" rx="10"/>
  <text class="g m" x="795" y="174">DB 에서 만든 사본</text>
  <text class="l m" x="795" y="194">한 방향 (돌아오지 않는다)</text>
  <line class="a" x1="652" y1="240" x2="697" y2="240"/>
  <text class="l m" x="675" y="231">만든다</text>

  <rect class="copy" x="712" y="208" width="166" height="68" rx="8"/>
  <text class="t m" x="795" y="235">엑셀 폴더</text>
  <text class="s m" x="795" y="258">일별·월별 엑셀</text>

  <rect class="copy" x="712" y="290" width="166" height="68" rx="8"/>
  <text class="t m" x="795" y="317">통합 DB</text>
  <text class="s m" x="795" y="340">PostgreSQL · 현장 서버</text>

  <rect class="copy" x="712" y="372" width="166" height="68" rx="8"/>
  <text class="t m" x="795" y="399">가린 쪽 그림</text>
  <text class="s m" x="795" y="422">명령으로 만든다</text>

  <!-- 범례 -->
  <rect class="orig" x="450" y="463" width="26" height="16" rx="3"/>
  <text class="l" x="484" y="476">원본 — 백업한다</text>
  <rect class="copy" x="620" y="463" width="26" height="16" rx="3"/>
  <text class="l" x="654" y="476">다시 만들 수 있다</text>

  <!-- 프로그램 -->
  <rect class="grp" x="20" y="496" width="870" height="122" rx="10"/>
  <text class="g" x="36" y="518">프로그램 — 지워도(uninstall.ps1) 위의 데이터는 남는다</text>
  <rect class="box" x="36" y="530" width="410" height="76" rx="8"/>
  <text class="t" x="52" y="553">설치 폴더</text>
  <text class="s" x="52" y="575">%LOCALAPPDATA%\minedocscan — 앱 전용 파이썬, 로그</text>
  <text class="s" x="52" y="595">로그온하면 작업 스케줄러가 serve 를 띄운다</text>
  <rect class="box" x="462" y="530" width="412" height="76" rx="8"/>
  <text class="t" x="478" y="553">설정 파일</text>
  <text class="s" x="478" y="575">%APPDATA%\minedocscan\minedocscan.toml</text>
  <text class="s" x="478" y="595">위 폴더들의 자리 (MINEDOCSCAN_CONFIG 가 가리킨다)</text>
</svg>
