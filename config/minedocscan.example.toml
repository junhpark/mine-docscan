# minedocscan 설정 예시. 복사해서 저장소 루트에 minedocscan.toml 로 두거나 MINEDOCSCAN_CONFIG 로 경로를 준다.
# (minedocscan.toml 은 커밋되지 않는다.)  우선순위: 명령줄 옵션 > 환경변수 > 이 파일 > 기본값

[paths]
archive_root = "D:/shared/mine-docscan"                      # 스캔 원본. 읽기 전용으로 취급
site         = "D:/shared/mine-docscan/site-packs/my-site"   # 사이트 팩
work_root    = "C:/minedocscan-work"                         # DB·정합 이미지. 로컬 디스크, 동기화 폴더 밖
# reviews    = "D:/shared/mine-docscan/site-packs/my-site/reviews/reviews.jsonl"   # 검수 기록 (기본: <site>/reviews/reviews.jsonl)

[pipeline]
dpi = 200                    # 템플릿 좌표계의 해상도. 템플릿을 만든 해상도와 같아야 한다
auto_accept_conf = 0.90      # 이 신뢰도 이상이면 검수 없이 적재
classify_min_margin = 1.5    # 양식 분류 1위/2위 비율이 이보다 낮으면 표시
save_aligned = true          # 정합 이미지를 work_root/aligned 에 저장 (검수·디버깅용)
damaged_pdf = "fail"         # 라이브러리가 복구해서 연 PDF(끝이 잘린 파일 등): fail = 문서 실패 | warn = 처리하고 경고를 남김
                             # 멀쩡한 스캔이 늘 "복구가 필요했습니다"로 실패하는 스캐너라면 warn (MINEDOCSCAN_DAMAGED_PDF)

[recognize]
backend = "null"             # 등록된 인식 백엔드 이름 (minedocscan info 로 확인) — 아래 by_kind 에 없는 칸 종류에 쓴다

# 칸 종류마다 다른 백엔드 (handwritten_number | handwritten_text). 없으면 모든 칸에 backend
# [recognize.by_kind]
# handwritten_number = "digits"

# 숫자 인식기 (docs/DATA.md "숫자 인식기"). 모델은 사이트 팩의 models/<이름>/ — site.toml 의 같은 항목보다 이 파일이 이긴다
# [recognize.digits]
# model = "digits-v1"        # 이름 또는 모델 폴더 경로. 없으면 run 이 시작할 때 멈춘다
# auto_accept_conf = 0.97    # (선택) 모델 카드의 자동 적재 기준 대신. 우선순위: 이것 > 카드 > [pipeline] auto_accept_conf

# 표 밖 필드(쪽 메타)의 모델 (docs/SITE_PACK.md "메타 필드 모델"). 키마다 models/<이름> — 모델 카드의 meta.keys 에 있는 키만.
# 없는 키는 지금처럼 라벨·검수로만 정한다. 기계 값은 메타의 맨 아래: 라벨·검수가 있으면 대조만 한다
# [recognize.meta]
# vehicle_no   = "veh-v1"
# operator     = "op-v1"
# "date.month" = "date-v1"   # 손으로 쓴 월·일 — 쪽의 날짜와 대조만 한다
# "date.day"   = "date-v1"

[correct]
backend = "none"

[review]
source_dpi = 300             # 검수 화면·크롭 내보내기에서 원본 PDF 를 렌더링하는 해상도 (스캔 원본과 같게)

[database]
# url = "sqlite:///C:/minedocscan-work/minedocscan.db"       # 기본: sqlite:///<work_root>/minedocscan.db
