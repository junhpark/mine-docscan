# minedocscan 설정 예시. 복사해서 저장소 루트에 minedocscan.toml 로 두거나 MINEDOCSCAN_CONFIG 로 경로를 준다.
# (minedocscan.toml 은 커밋되지 않는다.)  우선순위: 명령줄 옵션 > 환경변수 > 이 파일 > 기본값

[paths]
archive_root = "D:/shared/mine-docscan"                      # 스캔 원본. 읽기 전용으로 취급 — 접수(watch·serve)만 그 아래 intake/ 에 쓴다
site         = "D:/shared/mine-docscan/site-packs/my-site"   # 사이트 팩
work_root    = "C:/minedocscan-work"                         # DB·정합 이미지. 로컬 디스크, 동기화 폴더 밖
# reviews    = "D:/shared/mine-docscan/site-packs/my-site/reviews/reviews.jsonl"   # 검수 기록 (기본: <site>/reviews/reviews.jsonl)
#                                                            # 결정 기록 decisions.jsonl 은 그 옆
# inbox      = "C:/Scans"                                    # 접수 폴더 = 스캐너 프로그램의 저장 폴더 (MINEDOCSCAN_INBOX).
#                                                            # archive_root·work_root·사이트 팩과 겹치면 안 된다

[pipeline]
dpi = 200                    # 템플릿 좌표계의 해상도. 템플릿을 만든 해상도와 같아야 한다
auto_accept_conf = 0.90      # 이 신뢰도 이상이면 검수 없이 적재
classify_min_margin = 1.5    # 양식 분류 1위/2위 비율이 이보다 낮으면 표시
save_aligned = true          # 정합 이미지를 work_root/aligned 에 저장 (검수·디버깅용)
damaged_pdf = "fail"         # 라이브러리가 복구해서 연 PDF(끝이 잘린 파일 등): fail = 문서 실패 | warn = 처리하고 경고를 남김
                             # 멀쩡한 스캔이 늘 "복구가 필요했습니다"로 실패하는 스캐너라면 warn (MINEDOCSCAN_DAMAGED_PDF)
blank_max_ink = 0.02         # 양식을 못 찾은 쪽 중 어두운 화소가 이 비율 미만이면 빈 쪽 (양면 스캔의 뒷면)
dup_min_sim = 0.80           # 같은 날·같은 계열의 앞 쪽과 손글씨 자리가 이만큼 비슷하면 다시 스캔한 쪽으로 붙잡는다

[intake]                     # 접수 폴더 감시 (minedocscan watch · serve)
settle_seconds = 5           # 수정 시각이 이만큼 지나고 열리는 파일만 가져온다 (스캐너가 다 쓰기를 기다린다)
give_up_seconds = 120        # 이만큼 지나도 열리지 않으면 손상 방침대로 등록한다 (읽을 수조차 없으면 <inbox>/_failed 로)
poll_seconds = 3             # 접수 폴더를 훑는 간격

# 엑셀 내보내기 (docs/DATA.md, ADR 0022). excel_dir 가 없으면 자동 내보내기는 꺼져 있다 — export excel 은 OUT 을 받는다.
# watch·serve 가 바퀴 끝(접수 → 처리 → 엑셀 → 싣기)에 바뀐 날짜의 일별·월별 파일만 다시 쓴다 (내용의 해시가 같으면 건드리지 않는다)
# [export]
# excel_dir = "D:/shared/minedocscan-excel"   # MINEDOCSCAN_EXCEL_DIR. 있는 폴더여야 한다 (만들지 않는다).
#                                             # 저장소·접수 폴더·보관 폴더 안이면 켜지 않는다 — 엑셀에는 현장의 값(이름·차량번호)이 있다
# sweep_minutes = 30         # 전체 훑기의 간격 (분). 0 이면 시작할 때만 — 다른 프로세스(review serve)가 쓴 검수와 놓친 것을 잡는다
# machine_values = false     # true 면 업무 시트·긴 표에 "기계 값(확정 아님)" 열을 따로 둔다 (기본은 확정된 값만 — ADR 0008)

# 통합 DB(PostgreSQL)로 싣기 (ADR 0021) — pip install -e ".[postgres]"
# 대상의 URL(postgresql://사용자:비밀번호@호스트/DB)은 **환경변수 MINEDOCSCAN_PUBLISH_URL 로만** 준다. 이 파일에 적지 않는다
# ([publish] 에 url·dsn·password 가 있으면 설정 오류). URL 이 없으면 싣기는 꺼져 있다. 대상의 계정은 그 스키마에만 쓰는 전용 계정으로
# [publish]
# schema = "minedocscan"     # 대상의 스키마 (MINEDOCSCAN_PUBLISH_SCHEMA). 영문 소문자·숫자·밑줄
# enabled = true             # 없으면 URL 이 있을 때 켜진다. false 면 URL 이 있어도 watch·serve 가 싣지 않는다
# sweep_minutes = 30         # 전체 훑기의 간격 (분). 0 이면 시작할 때만 — 그 사이에는 바뀐 문서·날짜만
# connect_timeout_s = 5      # 연결을 기다리는 시간 (초, 1–600)
# retry_seconds = 60         # 싣기에 실패한 뒤(연결·판이 다름·…) 이만큼은 다시 연결하지 않는다 (꺼진 서버에 바퀴마다 매달리지 않게)

[recognize]
backend = "null"             # 등록된 인식 백엔드 이름 (minedocscan info 로 확인) — 아래 by_kind 에 없는 칸 종류에 쓴다

# 칸 종류마다 다른 백엔드 (handwritten_number | handwritten_text). 없으면 모든 칸에 backend
# [recognize.by_kind]
# handwritten_number = "digits"

# 숫자 인식기 (docs/DATA.md "숫자 인식기"). 모델은 사이트 팩의 models/<이름>/ — site.toml 의 같은 항목보다 이 파일이 이긴다
# [recognize.digits]
# model = "digits-v1"        # 이름 또는 모델 폴더 경로. 없으면 run 이 시작할 때 멈춘다
# auto_accept_conf = 0.97    # (선택) 모델 카드의 자동 적재 기준 대신. 우선순위: 이것 > 카드 > [pipeline] auto_accept_conf

# 표 밖 필드(쪽 메타)의 모델 (docs/SITE_PACK.md "메타 필드 모델"). 키마다 models/<이름> — 모델 카드의 meta.keys 에 있는 키만.
# 없는 키는 지금처럼 라벨·검수로만 정한다. 기계 값은 메타의 맨 아래: 라벨·검수가 있으면 대조만 한다
# [recognize.meta]
# vehicle_no   = "veh-v1"
# operator     = "op-v1"
# "date.month" = "date-v1"   # 손으로 쓴 월·일 — 쪽의 날짜와 대조만 한다
# "date.day"   = "date-v1"

[correct]
backend = "none"

[review]
source_dpi = 300             # 검수 화면·크롭 내보내기에서 원본 PDF 를 렌더링하는 해상도 (스캔 원본과 같게)

[database]                   # 작업 DB — 로컬 SQLite 만. 통합 DB(PostgreSQL)는 위의 [publish] 로 싣는다 (ADR 0021)
# url = "sqlite:///C:/minedocscan-work/minedocscan.db"       # 기본: sqlite:///<work_root>/minedocscan.db
