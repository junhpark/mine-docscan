[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minedocscan"
version = "0.2.0"
description = "광산 현장 수기 문서 스캔 → 인식 → 데이터베이스 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pymupdf>=1.24",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# 숫자 인식기 학습 (recognizer train). 추론·파이프라인에는 필요 없다 — 추론은 OpenCV 의 cv2.dnn 이 ONNX 를 읽는다.
# onnxscript 는 torch 의 새 ONNX 내보내기(dynamo)가 쓴다 — 예전 내보내기가 없어진 torch 에서의 대비
train = ["torch>=2.2", "onnx>=1.15", "onnxscript>=0.1"]

[project.scripts]
minedocscan = "minedocscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minedocscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 기본 실행에서 학습 테스트(train)는 뺀다 — torch 가 있어도. 돌리려면 `pytest -m train`
addopts = "-q -m 'not train and not fuzz'"
markers = [
  "realdata: 실제 현장 데이터가 필요한 회귀 테스트 (MINEDOCSCAN_SITE, MINEDOCSCAN_ARCHIVE_ROOT 가 없으면 건너뜀)",
  "train: 숫자 인식기를 학습하는 테스트 (torch 필요, 몇 분 걸린다). `pytest -m train` 으로만 돈다",
  "fuzz: 다시 처리의 불변식을 길게 흔드는 시험 (tasks/0007 4.8, 몇 분). `pytest -m fuzz` 로만 돈다 — CI 의 fuzz 작업",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
