# 윈도우 설치 묶음의 고정 판 (tasks/0009 4.5 가) — scripts/bundle.py 가 읽는다.
# 내려받은 것의 SHA-256 이 여기 적힌 것과 다르면 묶음 만들기가 멈춘다. 판을 올릴 때는 python.org·PyPI 가 알리는 해시를 확인해 같이 바꾼다.

[python]
# 앱 전용 파이썬 — python.org 의 embeddable 패키지 (3.12 의 마지막 바이너리 판. 그 뒤의 3.12 는 소스만 낸다)
version = "3.12.10"
url = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
sha256 = "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"   # 11,133,606 바이트 — python.org 의 .sigstore 묶음의 digest 와 같다

[pip]
# 앱 전용 파이썬 안에 pip 을 놓을 바퀴 (PyPI)
version = "26.2.1"
url = "https://files.pythonhosted.org/packages/f3/6e/1736e5b4ae2b778ef2f81c47d797de9f891d4d8acb047a24ca37a60294dd/pip-26.2.1-py3-none-any.whl"
sha256 = "71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e"

[wheels]
# 런타임 의존성을 받는 판: 앱 전용 파이썬과 같은 cp312, win_amd64
python_version = "3.12"
platform = "win_amd64"
extras = ["postgres"]
# 표식(sys_platform == "win32")은 pip download 가 묶음을 만드는 기계로 평가한다 — 윈도우에서만 드는 것을 적어 둔다
windows_only = ["tzdata"]
